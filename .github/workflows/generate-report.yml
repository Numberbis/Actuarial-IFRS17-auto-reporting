name: Generate IFRS 17 Report

on:
  push:
  pull_request:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      reporting_date:
        description: 'Reporting date (YYYY-MM-DD)'
        required: false
        default: ''
      company_name:
        description: 'Company name'
        required: false
        default: 'Insurance Company'

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate IFRS 17 Report
        run: |
          REPORTING_DATE="${{ github.event.inputs.reporting_date }}"
          COMPANY_NAME="${{ github.event.inputs.company_name }}"

          if [ -z "$REPORTING_DATE" ]; then
            python -m ifrs17.main --company-name "${COMPANY_NAME:-Insurance Company}"
          else
            python -m ifrs17.main --reporting-date "$REPORTING_DATE" --company-name "${COMPANY_NAME:-Insurance Company}"
          fi

      - name: Install WeasyPrint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji libpango-1.0-0 libpangoft2-1.0-0
          pip install weasyprint

      - name: Generate HTML and PDF reports
        run: |
          python scripts/generate_pdf.py

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ifrs17-reports
          path: |
            reports/ifrs17_report.md
            reports/ifrs17_report.html
            reports/ifrs17_report.pdf
          retention-days: 90
